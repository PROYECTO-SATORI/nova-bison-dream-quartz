<!doctype html>
<html><head><style>
html,body{margin:0;background:#c8cdd6}
.row{display:flex;gap:28px;align-items:end;padding:20px 24px}
.box{display:flex;flex-direction:column;align-items:center;gap:8px;font:12px sans-serif;color:#10294d}
.tile{background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
</style></head>
<body>
<div class="row">
  <div class="box"><div class="tile" style="width:16px;height:16px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Habita U">
  <rect width="16" height="16" rx="3.5" fill="#10294d"/>
  <polygon points="8,2 15,8 1,8" fill="#f3f5fa"/>
  <rect x="3" y="8" width="10" height="7" fill="#f3f5fa"/>
  <rect x="6.5" y="10.5" width="3" height="4.5" fill="#e85d04"/>
</svg>
</div><span>16</span></div>
  <div class="box"><div class="tile" style="width:32px;height:32px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Habita U">
  <rect width="16" height="16" rx="3.5" fill="#10294d"/>
  <polygon points="8,2 15,8 1,8" fill="#f3f5fa"/>
  <rect x="3" y="8" width="10" height="7" fill="#f3f5fa"/>
  <rect x="6.5" y="10.5" width="3" height="4.5" fill="#e85d04"/>
</svg>
</div><span>32</span></div>
  <div class="box"><div class="tile" style="width:64px;height:64px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Habita U">
  <rect width="16" height="16" rx="3.5" fill="#10294d"/>
  <polygon points="8,2 15,8 1,8" fill="#f3f5fa"/>
  <rect x="3" y="8" width="10" height="7" fill="#f3f5fa"/>
  <rect x="6.5" y="10.5" width="3" height="4.5" fill="#e85d04"/>
</svg>
</div><span>64</span></div>
</div>
</body></html>
